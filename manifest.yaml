version: 0.0.1
type: plugin
author: architect-xyz
name: liquid
label:
  en_US: Liquid Inference
description:
  en_US: Liquid Inference is an auction exchange for LLM inference. Providers compete for each request, and you pay for the tokens used.
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 268435456
  permission:
    model:
      enabled: false
plugins:
  models:
    - provider/liquid.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.0.0
created_at: 2026-10-21T00:00:00.000000000+00:00
privacy: PRIVACY.md
repo: https://github.com/architect-xyz/liquid-dify-plugin
network:
  domains:
    - router.inference.ai.exchange
    - dify.ai
contact: dev@architect.co
